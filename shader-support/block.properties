# ==========================================================================
#  mzycBuild · 光影包彩色光配置片段（block.properties）
# ==========================================================================
#
#  这个文件本身不会自动生效 —— 它是给你「照抄/合并」到光影包里的模板。
#
#  用法：把下面两行方块 ID **按你光影包的格式**，加进
#        光影包/shaders/block.properties 里「对应颜色」的那一组。
#        数字（block.N）用几号不重要，关键是「放进哪一组」：
#            放红组 = 投红光，放黄组 = 投黄光。
#
#  示意（组号/格式请照抄你光影包里已有行的样子）：
#      block.12 = minecraft:redstone_lamp ... mzycbuild:red_light_block
#      block.11 = minecraft:glowstone   ... mzycbuild:light_block
#
#  三条硬规矩（Bliss / 多数光影包都适用）：
#    1. 一个方块 ID 在整个 block.properties 里**只能出现一次**，重复会让光影报错；
#    2. **不能新建颜色组**，只能把 ID 追加进已有组；
#    3. 光影包本身必须支持「彩色光照 / Colored Lights / Floodfill」才有意义。
#
#  本模组的方块 ID：
#     mzycbuild:red_light_block     红色灯光方块   -> 建议放「红」组
#     mzycbuild:light_block         黄色灯光方块   -> 建议放「黄 / 暖白」组
#
#  改完在游戏里按 F3 + T 重载光影（或重进一次）即可看到效果。
# ==========================================================================
